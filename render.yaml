services:
  - type: web
    name: ecoreceipt-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLIMATIQ_API_KEY
        sync: false

  - type: web
    name: ecoreceipt-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_MODE
        value: live
      - key: VITE_API_BASE_URL
        sync: false # set to the ecoreceipt-api service URL, e.g. https://ecoreceipt-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
